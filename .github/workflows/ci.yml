name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "18" }
      - run: cd backend && npm ci
      - run: cd backend && npx eslint . --ext .js --ignore-path .gitignore || echo "Lint warnings"

  test-backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports: ["27017:27017"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "18" }
      - run: cd backend && npm ci
      - run: cd backend && npm test
    env:
      MONGO_URI: mongodb://localhost:27017/test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_secret_key_for_ci

  test-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: cd backend/ml-service && pip install -r requirements.txt
      - run: cd backend/ml-service && pytest tests/ -v || echo "ML tests need running service"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
