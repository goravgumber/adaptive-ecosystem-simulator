services:
  mongodb:
    image: mongo:6.0
    container_name: ecosystem_mongodb_dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db

  redis:
    image: redis:7.0-alpine
    container_name: ecosystem_redis_dev
    ports:
      - "6379:6379"

  ml-service:
    build:
      context: ./backend/ml-service
      dockerfile: Dockerfile
    container_name: ecosystem_ml_service_dev
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/ml-service:/app
      - /app/.venv
      - /app/__pycache__

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecosystem_backend_dev
    command: npm run dev
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/ecosystem
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=development_fallback_secret_key_9999
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongodb
      - redis
      - ml-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecosystem_frontend_dev
    # Override standard nginx web serving to run development server
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend

volumes:
  mongodb_data_dev:
